[package]
name = "kitt-eye-mcu"
version = "0.1.0"
edition = "2021"
authors = ["kitt-eye"]

[dependencies]
esp-idf-sys = { version = "0.34", features = ["binstart"] }
esp-idf-svc = { version = "0.48", features = ["alloc", "experimental"] }
esp-idf-hal = "0.43"
log = "0.4"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
smart-leds = "0.4"
ws2812-esp32-rmt-driver = { version = "0.9", features = ["smart-leds-trait"] }

[build-dependencies]
embuild = "0.31"
