[package]
edition      = "2024"
name         = "kitt-eye"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "kitt-eye"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32c3", "unstable"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3"] }
critical-section = "1.2.0"

smart-leds = "0.4.0"
# mosi_idle_high + reset_single_transaction: crate README fix for
# "first LED always on" / MOSI not idle-low (common on many HALs).
ws2812-spi = { version = "0.5.1", features = [
  "mosi_idle_high",
  "reset_single_transaction",
] }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# ws2812-spi timing is sensitive; crate README recommends opt-level 3 (or --release).
# "s" can produce full-white / stuck first-LED symptoms.
opt-level = 3

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 3
